# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".github",
    ".idea",
    "KiGit/build/*",
    "build",
    ".toml"
]

# Same as Black.
#line-length = 88
line-length = 80
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
#select = ["E4", "E7", "E9", "F"]
select = ["ERA001", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "ANN401", 
"ASYNC100", "S103", "S104", "S105", "S106", "S107", "S108", "S110", "S112", "S113", "S201", "S303", "S304", "S305", 
"S306", "S308", "S324", "S404", "S602", "S603", "S604", "S605", "S607", "S609", "S704", "BLE001", "FBT001", "FBT002", 
"FBT003", "B", "A", "COM812", "COM818", "COM819", "DTZ", "EM", "EXE", "INT", "ISC", "ICN", "LOG", "G", "INP001", "PIE",
"T20", "PYI", "PT", "Q", "RSE102", "RET", "SLF", "SIM", "TC", "PTH", "FLY", "I002", "C901", "NPY", "N", "PERF", "E101", "E401",
"E402", "E501", "E701", "E702", "E703", "E711", "E712", "E713", "E714", "E721", "E722", "E731", "E741", "E742", "E743", 
"E902", "W291", "W292", "W293", "W391", "W505", "W605", "DOC", "D", "F", "PGH003", "PGH005", "PLC", "PLE", "PLR", "PLW", "UP",
"FURB", "RUF", "TRY"]
ignore = ["D400", "D401", "D415", "W391", "DOC", "S404", "D211", "D212"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = 80 #"dynamic"