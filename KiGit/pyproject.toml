[project]
name = "KiGit_AutoIntern-3"
version = "0.3.0"
description = "CLI Tool to easily identify changes made in KiCad Projects working with Git"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.50",
    "importlib>=1.0.4",
    "logging>=0.4.9.6",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=2.0.4",
    "sexpdata>=1.0.2",
    "typer>=0.26.8",
]
[project.scripts]
kigit = "main:app"
[tool.setuptools]
py-modules = ["main", "kigit_globals"]
[tool.setuptools.packages.find]
include = ["parser*", "scripts*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]
