[project]
name = "KiGit"
version = "0.2.0"
description = "CLI Tool to easily identify changes made in KiCad Projects working with Git"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.50",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=2.0.4",
    "typer>=0.25.1",
    "unidiff>=0.7.5",
]
[project.scripts]
kigit = "main:app"
[tool.setuptools]
py-modules = ["main"]
[tool.setuptools.packages.find]
include = ["parser*", "scripts*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
